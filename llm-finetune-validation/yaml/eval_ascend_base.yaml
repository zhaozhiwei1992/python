### 基础模型（未微调）批量评测 —— 对照组
### 用途: 与 eval_ascend_1.5b_lora.yaml 的结果对比，
###       证明"基础模型答不对（分数≈0），微调后能答对（分数显著升高）"。
### 用法: llamafactory-cli eval eval_ascend_base.yaml

### model
model_name_or_path: /data/models/qwen2.5-1.5b-instruct
trust_remote_code: true

### method
stage: sft
finetuning_type: lora

### dataset
dataset_dir: data
dataset: ascend_finance_eval
template: qwen
cutoff_len: 1024
max_samples: 1000
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: saves/Qwen2.5-1.5B-Instruct/lora/eval_base
overwrite_output_dir: true
report_to: none

### eval
per_device_eval_batch_size: 1
predict_with_generate: true
max_new_tokens: 512
infer_dtype: float16
ddp_timeout: 180000000
